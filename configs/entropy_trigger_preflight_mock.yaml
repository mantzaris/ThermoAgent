stage: preflight_v2
planner_backend: mock
prompt_template_revision: planner-json-v7-route-affordances
llm_seed: 0
rl_seed: 0
decision_interval: 4
communication_budget: 120
fixed_broadcast_fanout: 3
calibration: results/reproducibility/macrostate_calibration.json
trigger:
  normalizers_path: results/entropy_triggered_v2/calibration/trigger_nominal_calibration.json
  normalizers_key: normalizers
  parameters:
    direction: low
applications:
  commercial:
    n_agents: 8
  humanitarian:
    n_agents: 8
methods: [fixed_always_on, doet_rule, kpi_cusum_trigger]
seeds: [6099]
method_variants:
  doet_rule:
    - name: cusum_local
      trigger:
        parameters:
          trigger_type: cusum
          direction: low
          rho: 0.8
          kappa: 0.15
          tau_on: 1.5
          tau_off: 0.5
          tau_crisis: 3.0
          propagation: local
    - name: hysteresis_neighbor
      trigger:
        parameters:
          trigger_type: hysteresis
          direction: low
          rho: 0.6
          kappa: 0.0
          tau_on: 1.2
          tau_off: 0.4
          tau_crisis: 2.8
          propagation: neighbor
  kpi_cusum_trigger:
    - name: kpi
      trigger:
        normalizers_key: kpi_normalizers
        parameters:
          direction: high
          tau_on: 1.5
          tau_off: 0.5
          tau_crisis: 3.0
scenarios:
  moderate:
    horizon: 12
    private_information: 0.8
    objective_misalignment: 0.8
    communication: reliable
    disruption: moderate
