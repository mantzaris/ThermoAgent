evidence_boundary: simulated operators only
profiles:
  high_accuracy_bounded:
    description: primary finite-capacity operator
    oracle: false
  fast_imperfect:
    description: lower latency with lower decision accuracy
    oracle: false
  slow_accurate:
    description: higher latency and service time with high accuracy
    oracle: false
  fatigue_sensitive:
    description: stronger workload-dependent degradation and slower recovery
    oracle: false
  risk_averse:
    description: higher intervention threshold and emergency caution
    oracle: false
  oracle:
    description: privileged evaluator-only upper bound; unattainable
    oracle: true
note: Exact executable parameters are serialized from thermoagent.human_operator.OPERATOR_PROFILES in run manifests.
