study: thermohitl_v4
title: Distributed thermodynamic observability for scarce human attention
evidence_stage: development
applications:
  - commercial
  - humanitarian
  - utility_restoration
model:
  identifier: Qwen/Qwen2.5-7B-Instruct
  revision: a09a35458c702b33eeacc393d103063234e8bc28
  precision: bitsandbytes_NF4_with_BF16_compute
  prompt_revision: thermohitl-v4-utility-json-v1
simulation:
  horizon: 20
  disruption_step: 6
  incidents_per_episode: 3
  operator_slots: 1
  operator_budget: 1
  intervention_service_steps: 2
  minimum_request_cooldown: 3
  nominal_energy_center: 0.10
  nominal_energy_scale: 0.05
  nominal_entropy_center: 0.32
  nominal_entropy_scale: 0.08
  low_confidence_abstention: 0.45
energy_weights:
  service_deficit: 0.34
  backlog: 0.18
  lateness: 0.10
  unsafe_stress: 0.12
  failed_commitments: 0.10
  congestion: 0.08
  resource_scarcity: 0.08
thermodynamic_trigger:
  energy_weight: 0.30
  entropy_anomaly_weight: 0.20
  entropy_slope_weight: 0.10
  disagreement_weight: 0.28
  disruption_risk_weight: 0.12
  confidence_penalty: 0.25
  workload_penalty: 0.20
  tau_on: 1.15
  tau_off: 0.45
  minimum_dwell: 2
  cooldown: 3
feature_blocks:
  - local_kpi_only
  - energy_only
  - entropy_disagreement_only
  - kpi_plus_energy
  - kpi_plus_entropy_disagreement
  - complete_thermodynamic
  - exploratory_free_energy
primary_model:
  class: l2_regularized_logistic
  regularization_grid: [0.05, 0.2, 1.0, 5.0]
  inner_folds: 3
  outer_split_unit: environment_panel
  calibration: sigmoid_train_fold_only
  selection_metric: budgeted_causal_intervention_utility
development:
  seeds: [24001, 24002, 24003, 24004, 24005, 24006, 24007, 24008, 24009, 24010, 24011, 24012]
  regimes: [nominal, isolated_physical, telemetry_integrity, partition, correlated, compound]
  information_conditions: [private_fragmented, globally_public]
  planner: deterministic_independent_agents
real_qwen_qualification:
  seeds: [24901, 24902]
  episodes_per_application: 2
  first_pass_validity_minimum: 0.90
  validity_after_one_repair_minimum: 0.98
  accepted_to_next_stage_minimum: 0.70
  accepted_to_service_minimum: 0.30
validation:
  seeds: [25001, 25002, 25003, 25004, 25005, 25006, 25007, 25008]
  run_once: true
training:
  seeds: [26001, 26002, 26003, 26004, 26005]
  steps_per_seed: 24000
  checkpoint_rule: final_checkpoint_unless_nonfinite
holdout:
  seed_generation_namespace: thermohitl-v4-holdout-v1
  panels_per_primary_regime_application_minimum: 12
  include_regimes: [nominal, isolated_physical, telemetry_integrity, partition, correlated, compound, ood]
  outcome_sealed: true
gates:
  coordination_necessity:
    aggregate_relative_loss_reduction_minimum: 0.05
    per_regime_relative_loss_reduction_minimum: 0.02
    improved_fragmented_regimes_per_application_minimum: 2
  human_causal_usefulness:
    relative_loss_reduction_minimum: 0.02
    per_regime_relative_loss_reduction_minimum: 0.02
    improved_regimes_per_application_minimum: 2
    required_application_count: 2
    complete_causal_chain_minimum: 1
  thermodynamic_incremental_value:
    required_applications: [humanitarian, utility_restoration]
    relative_budgeted_utility_gain_minimum: 0.05
    cluster_bootstrap_lower_bound_minimum: 0.0
    harmful_intervention_rate_increase_maximum: 0.02
    service_loss_noninferiority_margin: 0.02
    bootstrap_replicates: 10000
    bootstrap_seed: 44041
  trigger_feasibility:
    timely_activation_minimum: 0.75
    pre_disruption_false_activation_maximum: 0.10
    nominal_false_activation_maximum: 0.10
    maximum_active_epoch_fraction: 0.50
  mechanism_specificity:
    fragmented_minus_public_gain_minimum: 0.05
    shuffled_gain_fraction_maximum: 0.50
    within_kpi_stratum_permutation_replicates: 2000
    permutation_seed: 44043
integrity:
  primary_unit: complete_environment_panel
  no_selective_reruns: true
  retain_failed_attempts: true
  maximum_conservation_residual: 1.0e-9
  real_human_participants: false
  cyber_scope: abstract_defensive_simulation_only
