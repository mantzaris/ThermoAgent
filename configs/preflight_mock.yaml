# Deterministic analysis/figure integration preflight. These outputs are not
# research evidence and should be written outside results/.
stage: main
planner_backend: mock
prompt_template_revision: planner-json-v6
llm_seed: 0
rl_seed: 3001
decision_interval: 3
communication_budget: 10
calibration: results/reproducibility/macrostate_calibration.json
checkpoints:
  no_entropy: results/checkpoints/coordination_no_entropy.pt
  thermo: results/checkpoints/coordination_thermo.pt
model:
  identifier: deterministic-mock-preflight
  revision: mock-v2
  precision: none
  decoding:
    do_sample: false
applications:
  commercial:
    n_agents: 8
  humanitarian:
    n_agents: 8
methods:
  - centralized_lookahead
  - centralized_llm
  - scripted_independent
  - autonomous_no_comm
  - autonomous_fixed_comm
  - learned_no_entropy
  - thermoagent
  - random_gate
  - global_entropy_oracle
  - shuffled_entropy
seeds: [9991]
scenarios:
  p0_o0_moderate:
    horizon: 10
    private_information: 0.0
    objective_misalignment: 0.0
    communication: reliable
    disruption: moderate
  p0_o1_moderate:
    horizon: 10
    private_information: 0.0
    objective_misalignment: 1.0
    communication: reliable
    disruption: moderate
  p1_o0_moderate:
    horizon: 10
    private_information: 1.0
    objective_misalignment: 0.0
    communication: reliable
    disruption: moderate
  p1_o1_moderate:
    horizon: 10
    private_information: 1.0
    objective_misalignment: 1.0
    communication: intermittent
    disruption: moderate
  p1_o1_compound:
    horizon: 10
    private_information: 1.0
    objective_misalignment: 1.0
    communication: partition
    disruption: compound
