protocol_version: "v10.1.3-llm-pilot-amendment"
base_cpu_protocol_version: "v10.1.0-frozen-cpu"
base_cpu_protocol_sha256: "fe1b8a599f82da6ce7b69ece6479b90dc7ddcb923b90e8e5a9fd3249be8efbf5"
status: "PILOT_ONLY_NOT_FORMAL"
dated: "2026-08-17"

rationale:
  - "The direct public-IP SSH route was stale; the established RunPod proxy route reached the same authorized Pod."
  - "Pilot attempt 2 aliased six evidence fields with option order and therefore could not identify option-order bias."
  - "The corrected evidence pilot fully crosses the same six fields and two orders at the unchanged 120-decision budget."
  - "The base protocol required message counterfactual response, but its original single-agent pilot could not exercise a delivered message."
  - "A separate matched message pilot is added before formal unlock; no formal outcome had been generated when this amendment was written."
  - "Message-pilot attempt 1 accidentally initialized every target belief to plan_left because pair parity was aliased with replicate parity. The retained correction balances both prior beliefs inside every design cell without changing the prompt or gate."
  - "Balanced-prior message-pilot attempt 2 retained the prior in all 48 decisions. Before formal outcomes, the prompt was repaired once to identify inbox entries as newly delivered evidence and define the locally visible influence weight; it does not direct a particular plan and the response gate remains unchanged."

evidence_pilot:
  fields: [-1.0, -0.55, -0.15, 0.15, 0.55, 1.0]
  option_orders: [left_first, right_first]
  replicates_per_field_order: 10
  total_decisions: 120
  unchanged_maximum_absolute_option_order_effect: 0.15

message_counterfactual_pilot:
  applications: [humanitarian, utility]
  prompt_paraphrases: 3
  option_orders: [left_first, right_first]
  replicates_per_application_paraphrase_order: 2
  previous_beliefs_per_cell: [plan_left, plan_right]
  previous_actions_per_cell: [plan_right, plan_left]
  matched_pairs: 24
  total_decisions: 48
  private_evidence: "balanced and inconclusive"
  minimum_right_minus_left_message_response: 0.20
  minimum_paired_choice_switch_fraction: 0.20
  minimum_first_pass_validity: 0.90
  minimum_after_repair_validity: 0.98

formal_unlock:
  requires_corrected_evidence_pilot_pass: true
  requires_message_counterfactual_pilot_pass: true
  requires_new_llm_source_freeze_after_all_pilot_repairs: true
  preserves_cpu_formal_freeze: true
  technical_recovery_rule: "Completed atomic batches are immutable. After infrastructure interruption, retain all raw failure artifacts and restart only the incomplete whole batch with its unchanged seed set; never rerun a completed batch or select by outcome."

formal_design_overrides:
  rationale: "Increase dynamic graph replication from two to three panels per application and size before formal outcomes; keep the controlled-kernel design unchanged."
  dynamic_independent_panels: 6
  calibration_decisions: 672
  controlled_kernel_decisions: 9216
  dynamic_decisions: 3840
  planned_primary_decisions: 13728
  maximum_model_calls_including_repairs: 16500
  matched_inference_seed_across_alpha: true
  matched_graph_initial_state_and_environment_across_alpha: true

llm_analysis:
  kernel_bootstrap_replicates: 10000
  kernel_bootstrap_seed: 550001
  dynamic_shuffle_replicates_per_panel: 500
  dynamic_shuffle_seed: 550002
  empirical_kernel_pseudocount: 0.5
  h5_maximum_heldout_brier: 0.25
  h5_minimum_relative_nll_improvement_over_intercept: 0.05
  h5_requires_positive_field_slope: true
  h5_maximum_absolute_option_order_slope: 0.15
  h6_requires_quadratic_coefficient_lower_95_above_zero: true
  h7_comparison_alpha: 0.65
  h7_minimum_positive_panels_per_six_for_each_size: 4
  markov_material_cmi_above_shuffle_95: 0.02
  multiple_comparison_method: "Holm for prespecified confirmatory LLM families"
