  multiple_comparison_method: "Holm"
  curve_models: [linear_zero_intercept, quadratic_zero_intercept, linear_plus_quadratic_zero_intercept]
  transition_estimators: [transition_pair_KL, block_time_reversal_KL]
  llm_markov_rule: "if conditional memory dependence remains material, label (b,a) statistic coarse-grained irreversibility, not total EPR"

