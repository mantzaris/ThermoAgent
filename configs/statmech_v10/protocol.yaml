hypotheses:
  H1: "exact reciprocal stationary entropy production is below 1e-12 nats/update"
  H2: "the perturbative C is positive and agrees within 2% with exact sigma/alpha^2 for alpha<=0.02"
  H3: "C varies with topology, antisymmetric spectral structure, and belief-action coupling"
  H4: "temperature dependence is estimated without prespecifying a peak at the V9 crossover"
  H5: "a held-out-paraphrase logit local policy is adequate only if calibration and likelihood diagnostics support it"
  H6: "LLM nonreciprocity requires a bias-corrected lower confidence bound above the matched reciprocal null"
  H7: "LLM replication requires both network sizes, prompt paraphrases, graph realizations, and inference seeds"

analysis:
