protocol: v11-formal-network-template-1.1
status: locked_until_qualification_passes
scientific_role: prospective_template_written_before_decisive_qualification_outcomes
starting_v10_commit: 4d372f00837bf75f90882392a92feac87dbc84b2
hypotheses:
  H1: calibrated delivered evidence causes a directionally correct continuous-belief update
  H2: belief response increases with reliability or cumulative independent evidence
  H3: matched nonreciprocal networks have greater bias-corrected coarse trajectory irreversibility than reciprocal networks
  H4: excess weak-nonreciprocity irreversibility has a positive quadratic component consistent with the V10 mechanism
  H5: the effect survives matched traffic diagnostics and weakens under evidence-destroying controls
formal:
  model_id: Qwen/Qwen2.5-7B-Instruct
  model_revision: a09a35458c702b33eeacc393d103063234e8bc28
  quantization: NF4_double_quantization_BF16_compute
  inference_sampling_temperature: 0.65
  top_p: 0.90
  maximum_new_tokens: 300
  private_signal_reliability_levels: [0.55, 0.70, 0.85]
  agent_counts: [6, 8]
  topologies: [ring, modular]
  orientation_seeds: [31, 47]
  environment_seeds: [101, 202]
  nonreciprocity_levels: [0.0, 0.15, 0.40, 0.75]
  trajectory_turns: 128
  burn_in_turns: 32
  seed_base: 11000000
  control_design:
    n_agents: 6
    topology: ring
    alpha: 0.75
    turns: 64
    orientation_seeds: [31, 47]
    environment_seeds: [101, 202]
    controls:
      - unaltered
      - no_message
      - message_permutation
      - reliability_permutation
      - reliability_destroyed
      - content_reversal
      - natural_language_placebo
      - reported_probability_removed
      - commitment_removed
analysis:
  independent_unit: graph_orientation_by_environment_seed_panel
  cluster_bootstrap_replicates: 10000
  shuffle_replicates_per_panel: 200
  analysis_seed: 1119001
  maximum_markov_history_cmi: 0.02
  primary_metric: bias_corrected_block_length_3_time_reversal_KL
  interpretation_if_markov_gate_fails: coarse_grained_irreversibility_lower_bound
  primary_comparison: alpha_0.75_minus_alpha_0.0_matched_by_panel
  weak_alpha_range: [0.0, 0.15, 0.40]
  weak_alpha_models:
    - zero_intercept_linear
    - zero_intercept_quadratic
    - linear_plus_quadratic
  model_comparison: cluster_level_leave_one_cluster_out_squared_error_plus_theory_consistency
  h3_success_rule: pooled_and_each_application_cluster_bootstrap_lower_95_bound_above_zero
  h4_success_rule: positive_quadratic_coefficient_lower_95_bound_above_zero_and_quadratic_not_worse_than_linear_in_held_out_error
  h5_success_rule: >-
    message and wire-byte ratios across primary alpha arms remain within 10 percent,
    or a declared matched-volume sensitivity is the primary robustness analysis;
    evidence permutation or destruction must materially attenuate the effect
  maximum_primary_traffic_ratio_difference: 0.10
  normalization:
    - per_attempted_update
    - per_agent_sweep
  traffic_controls:
    - actual_messages
    - actual_wire_bytes
    - prompt_tokens
    - generated_tokens
    - matched_volume_sensitivity
exclusions:
  - no scientific exclusion for an unfavorable valid panel
  - invalid_after_one_repair is retained as a failed update with no substituted action
  - infrastructure interruption resumes only incomplete panels; orphan raw calls remain retained
compute_plan:
  primary_panels: 128
  primary_decision_requests: 16384
  control_panels: 72
  control_decision_requests: 4608
  total_decision_requests: 20992
  projected_model_calls_including_repairs: 21450
  projected_prompt_tokens: 13400000
  projected_generated_tokens: 1950000
  projected_gpu_hours: 10.3
  projected_cost_usd_range: [3.50, 7.11]
  hard_gpu_hour_cap: 20.0
  rationale: >-
    32 independent matched graph-orientation/environment clusters, 96 retained
    post-burn-in turns per primary panel, and 32 retained turns per control
    panel balance estimator precision against the existing single-GPU cap.
reporting:
  llm_metric_if_markov_inadequate: coarse_grained_block_time_reversal_KL_lower_bound
  prohibited_term: exact_LLM_entropy_production
  applications:
    - humanitarian_route_viability
    - defensive_utility_repair_hypothesis
  raw_artifacts_external_only: true
