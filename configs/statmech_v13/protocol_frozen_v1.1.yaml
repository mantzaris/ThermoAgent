hypotheses:
  H1: increasing coupling increases finite-size order susceptibility and relaxation
    time in the V12 direction
  H2: increasing decoding noise decreases finite-size order susceptibility and relaxation
    time in the V12 direction
  H3: persistent bounded memory increases adjusted coarse-grained pathwise irreversibility
    relative to matched Markovized agents
  H4: controlled disruptions depart from the nominal energy-entropy-order manifold
  H5: disruption classes have distinguishable transient and recovery trajectories
    in the frozen macrostate space
  H6: the full statistical-mechanical representation improves trajectory-level regime
    characterization over simple and order-only representations
  H7: the fitted kinetic surrogate captures principal coupling and noise trends but
    leaves residual LLM structure
