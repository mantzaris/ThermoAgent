  expected_decisions: 256
  first_pass_valid_minimum: 0.95
  after_repair_valid_minimum: 0.99
  latent_plus_occupancy_interval: [0.20, 0.80]
  minimum_transitions_each_direction: 1
  maximum_projected_formal_gpu_hours: 10.0
  maximum_projected_formal_prompt_tokens: 10000000
