version: v14-engineering-1.0
status: engineering_only
pilot:
  attempt_id: symmetry_and_schedule_smoke_01
  inspection_boundary:
    - structured_output_validity
    - latent_state_occupancy
    - transition_direction_counts
    - perturbation_timing_and_restoration
    - privacy_and_message_delivery
    - runtime_and_token_projection
  n_agents: 16
  topology: modular
  coupling_strength: 0.8
  inference_sampling_temperature: 0.5
