scientific_scope:
  primary_model: actual independent Qwen agents
  primary_update: random_sequential
  sweep_definition: N attempted agent updates
  independent_unit: matched graph_environment trajectory cluster
  primary_state: realized categorical belief and action with confidence commitment
    workload inbox outbox and bounded local memory
  interpretation: finite-size descriptive statistical mechanics; reference energy
    and pathwise irreversibility are effective coarse-grained quantities
hypotheses:
  H1:
    statement: persistent memory increases bias-adjusted pathwise irreversibility
    status: V12 discovery plus V13 prospective replication; no new V14 memory trajectories
    primary_block_length: 3
    synthesis: V12 and V13 reported separately plus descriptive inverse-variance fixed-effect
      synthesis
  H2:
    statement: field reversal produces larger maximum post-quench macrostate departure
      than matched nominal evolution in independent V14 clusters
    primary_estimand: paired cluster difference in maximum macrostate distance over
      disruption and recovery
    direction: greater_than_zero
  H3:
    statement: field-reversal trajectories relax toward the restored nominal macrostate
      after restoration
    primary_estimand: paired within-cluster early-recovery maximum minus final-five-sweep
      mean macrostate distance
    direction: greater_than_zero
  H4:
    statement: the full statistical-mechanics representation improves cluster-held-out
      discrimination over order-only representation
    primary_estimand: leave-one-cluster-out balanced-accuracy difference
    direction: greater_than_zero
  secondary:
  - partition and message-corruption trajectory responses
  - quench and counter-quench route asymmetry and hysteresis
  - block-length and covariance-estimator robustness
  - observable-family contribution and redundancy
  - effective-surrogate limitations
