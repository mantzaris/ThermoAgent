study: complexity-dependent generalized-entropic coordination V7
protocol_status: retained_feasibility_pilot_iteration_3_not_frozen
created_before_iteration_3_outcomes: true
informed_by:
  - iteration 2 utility accepted probes included 10 beneficial and 280 harmful actions
  - utility proposals were dominated by isolation and relay actions from roles with overly broad authority
changes_from_iteration_2:
  - role-specific utility action authorities are enforced for every utility role
  - communication failure is separated from physical service-edge failure
  - relay restoration prioritizes communication edges associated with the target asset
  - defensive isolation expires after a fixed four-step dwell period
unchanged:
  - belief generation and thermodynamic features do not use action outcomes
  - entropy does not affect domain transitions or action effects
  - evaluator probes are stratified by proposed action before outcomes are observed
purpose: verify domain actionability and a nondegenerate action pool; not estimate a formal entropy effect
