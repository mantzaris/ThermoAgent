scientific_question: >-
  Under fragmented private information and a fixed simulated-operator budget,
  does KPI plus distributed entropy and belief disagreement select more useful
  interventions than the same-information KPI-only policy in humanitarian and
  utility-restoration panels with multiple competitive incidents?
primary_applications: [humanitarian, utility_restoration]
boundary_application: commercial
primary_comparison: kpi_plus_entropy_disagreement_vs_kpi_only
primary_endpoint: paired_panel_budgeted_counterfactual_utility
independent_unit: competitive_environment_panel
operator_budget: 2
bootstrap_replicates: 10000
validation_unlock_requires_all_development_gates: true
holdout_unlock_requires_all_validation_gates: true
real_human_participants: false
cyber_scope: abstract_defensive_simulation_only
