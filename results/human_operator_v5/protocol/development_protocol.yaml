# Frozen prospective development protocol. The canonical machine-readable file
# is copied verbatim from configs/human_operator_v5_development.yaml before any
# V5 development outcomes are generated. It is intentionally duplicated here
# so the result package remains interpretable without source-code navigation.
study: thermohitl_v5
protocol_version: "5.0.3-development-frozen-after-pilot"
canonical_config: configs/human_operator_v5_development.yaml
frozen_before_formal_v5_development_outcomes: true
pilot_iteration_1_retained: true
